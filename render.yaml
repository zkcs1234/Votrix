# Render Blueprint — VOTRIX API
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo → New Blueprint → apply
# Or create a Web Service manually with Root Directory = backend

services:
  - type: web
    name: votrix-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CSRF_SECRET
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      # Enable only after the reviewed child-competition migrations are deployed
      # to Supabase (103+ for setup identity and the native foundation).
      - key: COMPETITION_CHILD_CONTEXTS_ENABLED
        value: 'true'
      - key: COMPETITION_NATIVE_SETUP_ENABLED
        value: 'true'
      # Exact additional production or preview origins, comma separated.
      - key: CLIENT_URLS
        sync: false
      - key: PREVIEW_CLIENT_URLS
        sync: false
      - key: WS_MAX_CONNECTIONS_PER_USER
        value: '5'
      - key: WS_MAX_CONNECTIONS
        value: '1000'
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
